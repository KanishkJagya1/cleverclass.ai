worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # 200 MB book PDFs, streamed straight through to the app rather than buffered
  # to disk by nginx first.
  client_max_body_size 256m;
  proxy_request_buffering off;

  log_format  cc  '$remote_addr $status $request_time "$request" "$http_user_agent"';
  access_log  /dev/stdout cc;
  error_log   /dev/stderr warn;

  # Docker's embedded DNS. Combined with `set $upstream …; proxy_pass $upstream;`
  # below, this forces nginx to re-resolve at REQUEST time.
  #
  # Without it nginx resolves each upstream once at startup and caches the
  # container IP forever — so after any rebuild that recreates a container,
  # every POST 502s while /health still passes. That exact failure is documented
  # in the LMS deploy script. Belt and braces: deploy.sh also restarts nginx.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Headroom for Next's response headers. It emits a single `link:` header
  # preloading every self-hosted font on the route — ~1.5 KB on some pages —
  # and nginx's default is one 4 KB buffer for the WHOLE header block.
  # Overflowing it is "upstream sent too big header", i.e. a 502 with the
  # request never reaching the client.
  #
  # This is precautionary, not a fix for anything observed: the admin-port 500
  # that prompted it turned out to be an unreadable .htpasswd (see
  # bootstrap-env.sh), and raising these buffers did not change it.
  proxy_buffer_size        16k;
  proxy_buffers            8 16k;
  proxy_busy_buffers_size  32k;

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade           $http_upgrade;
  proxy_set_header Connection        "upgrade";

  # ---------------------------------------------------------------- public --
  server {
    listen 8050 default_server;
    server_name _;

    # The admin panel is NOT reachable on the public port. Even though every
    # admin endpoint checks its own session, the panel has no business being
    # one guessed URL away on the storefront.
    location /admin      { return 404; }
    location /admin-api  { return 404; }

    location /api/ai/ {
      set $api http://cc-api:8000;
      rewrite ^/api/ai/(.*)$ /$1 break;
      proxy_pass $api;
      proxy_read_timeout 120s;
      # SSE: nginx buffers by default, which turns a stream into one delayed blob.
      proxy_buffering off;
      proxy_cache off;
    }

    location /preview/ {
      set $api http://cc-api:8000;
      proxy_pass $api;
      proxy_read_timeout 60s;
    }

    location /orders {
      set $api http://cc-api:8000;
      proxy_pass $api;
    }

    location / {
      set $web http://cc-web:3000;
      proxy_pass $web;
      proxy_read_timeout 120s;
      proxy_buffering off;   # Next streams RSC payloads
    }
  }

  # ----------------------------------------------------------------- admin --
  server {
    listen 8051;
    server_name _;

    # HTTP Basic auth REMOVED (requested 2026-08-05).
    #
    # It was layer one of three when the app's own auth was thin. It no longer
    # is: the admin session is an HttpOnly cookie resolved against the database,
    # every write double-submits a CSRF token, every route requires a named
    # permission, and login is rate limited to 10 attempts per 15 minutes per
    # IP. Those are the layers that actually identify WHO acted, which is what
    # makes `admin_audit` meaningful — Basic auth only ever gave one shared
    # identity everyone typed.
    #
    # Over plain HTTP it was also the weaker credential of the two: Basic auth
    # replays base64 credentials on EVERY request, where the app login sends a
    # password once. Removing it reduces how often that secret crosses the wire.
    #
    # ⚠ What this does change: the admin login page is now publicly reachable
    # on :8051. That is normal for an admin panel, and the rate limiter is what
    # stands behind it. Restore this block if the panel is ever exposed to the
    # open internet without TLS for a prolonged period.
    #
    #   auth_basic           "CleverClass Admin";
    #   auth_basic_user_file /etc/nginx/.htpasswd;

    location /admin-api/ {
      set $api http://cc-api:8000;
      proxy_pass $api;
      proxy_read_timeout 300s;   # PDF uploads
    }

    location /preview/ {
      set $api http://cc-api:8000;
      proxy_pass $api;
    }

    location / {
      set $web http://cc-web:3000;
      proxy_pass $web;
      proxy_read_timeout 300s;
      proxy_buffering off;
    }
  }
}
